# KlipperScreen configuration for macOS development

[main]
# theme: z-bolt
# theme: colorized
# theme: material-light
theme: material-dark
# theme: material-darker

[printer OBI1]
# Connect to OBI1 printer via network
moonraker_host: obi1.local
moonraker_port: 7125

# ACE Pro Filament Changer Menu
[menu __main ace]
name: ACE Pro
icon: ace
panel: ace
enable: {{ 'ace' in printer.config_sections }}

[preheat PLA]
bed = 60
extruder = 210

[preheat ABS]
bed = 100
extruder = 245

[preheat PETG]
bed = 80
extruder = 240
