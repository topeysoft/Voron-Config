#####################################################################
#   Custom Macros
#####################################################################

#####
# TIP CUTTING
#####

[gcode_macro CUT_TIP]
# rename_existing: _CUT_TIP_BASE
description: Cut filament by pressing the cutter on a pin with a horizontal movement
# Blade position - distance from nozzle to cutting blade (mm)
variable_blade_pos: 37.5
# Retract distance before cut to reduce filament waste
variable_retract_length: 20
# Retract distance after cut to ensure clean cut
variable_retract_after_cut: 3
# Cutter pin location - position where cutter just touches pin
variable_pin_loc_x: 17
variable_pin_loc_y: 250
# Safety margin before pin for approach
variable_pin_park_x_dist: 5.0
# X position when cutter is fully compressed
variable_pin_loc_x_compressed: 0.5
# Retract after cut to help lever decompress
variable_rip_length: 1
variable_rip_speed: 750
# Pushback of remaining tip into hotend after cut
variable_pushback_length: 5
variable_pushback_dwell_time: 0
# Movement speeds (mm/min)
variable_travel_speed: 10000
variable_cut_fast_move_speed: 2000
variable_cut_slow_move_speed: 500
variable_evacuate_speed: 10000
variable_extruder_move_speed: 1500
# Dwell time at cut point (ms)
variable_cut_dwell_time: 50
# Fraction of cut move at fast speed
variable_cut_fast_move_fraction: 1.0
# Safety margins for approach moves
variable_safe_margin_x: 30
variable_safe_margin_y: 30
# Eject filament after cut (for testing only)
variable_final_eject: 0
# Default temperature for cutting (used if extruder is cold)
variable_cut_temp: 220

gcode:
    {% set RETRACT_LENGTH = params.RETRACT_LENGTH | default(printer['gcode_macro CUT_TIP']['retract_length']) | float %}
    {% set RETRACT_AFTER_CUT_LENGTH = params.RETRACT_AFTER_CUT_LENGTH | default(printer['gcode_macro CUT_TIP']['retract_after_cut']) | float %}
    {% set PUSHBACK_LENGTH = params.PUSHBACK_LENGTH | default(printer['gcode_macro CUT_TIP']['pushback_length']) | float %}
    {% set FINAL_EJECT = params.FINAL_EJECT | default(printer['gcode_macro CUT_TIP']['final_eject']) | int %}
    {% set CUT_TEMP = params.TEMP | default(printer['gcode_macro CUT_TIP']['cut_temp']) | int %}

    {% set blade_pos = printer['gcode_macro CUT_TIP']['blade_pos'] | float %}
    {% set pin_loc_x = printer['gcode_macro CUT_TIP']['pin_loc_x'] | float %}
    {% set pin_loc_y = printer['gcode_macro CUT_TIP']['pin_loc_y'] | float %}
    {% set pin_park_x_dist = printer['gcode_macro CUT_TIP']['pin_park_x_dist'] | float %}
    {% set pin_loc_x_compressed = printer['gcode_macro CUT_TIP']['pin_loc_x_compressed'] | float %}
    {% set rip_length = printer['gcode_macro CUT_TIP']['rip_length'] | float %}
    {% set rip_speed = printer['gcode_macro CUT_TIP']['rip_speed'] | float %}
    {% set pushback_dwell_time = printer['gcode_macro CUT_TIP']['pushback_dwell_time'] | int %}
    {% set travel_speed = printer['gcode_macro CUT_TIP']['travel_speed'] | float %}
    {% set cut_fast_move_speed = printer['gcode_macro CUT_TIP']['cut_fast_move_speed'] | float %}
    {% set cut_slow_move_speed = printer['gcode_macro CUT_TIP']['cut_slow_move_speed'] | float %}
    {% set evacuate_speed = printer['gcode_macro CUT_TIP']['evacuate_speed'] | float %}
    {% set extruder_move_speed = printer['gcode_macro CUT_TIP']['extruder_move_speed'] | float %}
    {% set cut_dwell_time = printer['gcode_macro CUT_TIP']['cut_dwell_time'] | int %}
    {% set cut_fast_move_fraction = printer['gcode_macro CUT_TIP']['cut_fast_move_fraction'] | float %}
    {% set safe_margin_x = printer['gcode_macro CUT_TIP']['safe_margin_x'] | float %}
    {% set safe_margin_y = printer['gcode_macro CUT_TIP']['safe_margin_y'] | float %}

    {% set pin_park_x_loc = pin_loc_x + pin_park_x_dist %}
    {% set pin_park_y_loc = pin_loc_y %}

    SAVE_GCODE_STATE NAME=_CUT_TIP_state

    # Ensure XY are homed
    {% if ("xy" not in printer.toolhead.homed_axes) %}
        G28 X Y
    {% endif %}

    # Heat up if extruder is below extrusion temperature
    {% if params.TEMP is defined or printer.extruder.can_extrude|lower == 'false' %}
        M117 Heating...
        M104 S{CUT_TEMP}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={CUT_TEMP}
    {% endif %}

    # Disable pressure advance temporarily
    SET_PRESSURE_ADVANCE ADVANCE=0

    G90 ; Absolute positioning
    M83 ; Relative extrusion
    G92 E0

    # Retract filament to reduce waste
    {% if RETRACT_LENGTH > 0 %}
        G1 E-{RETRACT_LENGTH} F{extruder_move_speed}
    {% endif %}

    # Move to cutter pin with safety checks
    {% if ((printer.gcode_move.gcode_position.x - pin_park_x_loc) | abs < safe_margin_x) or ((printer.gcode_move.gcode_position.y - pin_park_y_loc) | abs < safe_margin_y) %}
        # Safe but slower travel - move axes separately
        G1 X{pin_park_x_loc} F{travel_speed}
        G1 Y{pin_park_y_loc} F{travel_speed}
    {% else %}
        # Direct travel when we have clearance
        G1 X{pin_park_x_loc} Y{pin_park_y_loc} F{travel_speed}
    {% endif %}

    # Perform cutting motion
    {% set fast_slow_transition_loc = (pin_loc_x_compressed - pin_park_x_loc) * cut_fast_move_fraction + pin_park_x_loc %}
    G1 X{fast_slow_transition_loc} F{cut_fast_move_speed} ; Fast approach
    G1 X{pin_loc_x_compressed} F{cut_slow_move_speed}     ; Slow cut
    G4 P{cut_dwell_time}                                   ; Dwell at cut point

    # Rip retract to help lever decompress
    {% if rip_length > 0 %}
        G1 E-{rip_length} F{rip_speed}
    {% endif %}

    # Evacuate from pin
    G1 X{pin_park_x_loc} F{evacuate_speed}

    # Pushback tip into hotend and retract
    {% if PUSHBACK_LENGTH > 0 %}
        G1 E{PUSHBACK_LENGTH} F{extruder_move_speed}
        {% if pushback_dwell_time > 0 %}
            G4 P{pushback_dwell_time}
        {% endif %}
        G1 E-{PUSHBACK_LENGTH} F{extruder_move_speed}
    {% endif %}

    # Retract filament a little make sure it's clear of the cut
    {% if RETRACT_AFTER_CUT_LENGTH > 0 %}
        G1 E-{RETRACT_AFTER_CUT_LENGTH} F{extruder_move_speed}
    {% endif %}

    # Final eject for testing
    {% if FINAL_EJECT == 1 %}
        G1 E-80 F{extruder_move_speed}
    {% endif %}

    RESTORE_GCODE_STATE NAME=_CUT_TIP_state MOVE_SPEED={travel_speed / 60} MOVE=1
    M117 Tip cut complete
    RESPOND MSG="Tip cut complete"

#####
# PURGE
#####

# [gcode_macro POOP]
# # rename_existing: _POOP_BASE
# description: Alias for NOZZLE_PURGE
# gcode:
#     NOZZLE_PURGE

#####
# NOZZLE PURGE
#####

[gcode_macro NOZZLE_PURGE]
# rename_existing: _NOZZLE_PURGE_BASE
description: Purge the nozzle before printing
variable_purge_x: 70
variable_purge_y: 331
variable_purge_z: 10
variable_purge_amt: 100
variable_purge_spd: 500
variable_retract_amt: -0.5
variable_retract_spd: 500
variable_purge_temp: 220

gcode:
    _STATUS_BUSY                 ;Status led
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Heat up if extruder is below extrusion temperature
    {% if params.TEMP is defined or printer.extruder.can_extrude|lower == 'false' %}
        M117 Heating...
        M104 S{params.TEMP|default(purge_temp)}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={params.TEMP|default(purge_temp)}
    {% endif %}

    # G91 ; relative positioning
    # G0 F9000 Z5 ; lift Z relative to current position
    # G90 ; absolute positioning

    # # Get current fan speed
    # {% set current_fan_speed = printer.fan.speed | default(0) | float %}

    # # Set fan to 100%
    # M106 S255

    M117 Purging ..........     ; Displays status message on LCD
    # G0 F9000 X{purge_x} Y{purge_y} Z{purge_z} ; Move to purge position
    # G92 E0 ; zero the extruded length
    # G1 E{purge_amt} F{purge_spd} ; Extrude some filament
    # G92 E0 ; zero the extruded length
    # G1 E{retract_amt} F{retract_spd} ; Retract a little

    # # Wait for moves to complete
    # M400

    # # Restore fan speed
    # M106 S{(current_fan_speed * 255) | int}

    GOOSE_PURGE PURGE_LENGTH={purge_amt} 
    NOZZLE_CLEAN PATTERN=zigzag 

    M117 Purge complete!


[gcode_macro NOZZLE_CLEAN]
description: Wipes nozzle on brush to clean it
# Example usage:
# NOZZLE_CLEAN                        # Standard cleaning (original behavior)
# NOZZLE_CLEAN MATERIAL=PETG          # Optimized for PETG
# NOZZLE_CLEAN PATTERN=zigzag         # Use zigzag pattern
# NOZZLE_CLEAN MATERIAL=TPU           # Optimized for TPU (slow, diagonal, extra wipes)

# Basic brush position and movement
variable_start_x: 128
variable_start_y: 347
variable_start_z: 1
variable_wipe_dist: -33
variable_wipe_qty: 3
variable_wipe_spd: 4000
variable_raise_distance: 30

# Pattern options: 'standard', 'diagonal', 'zigzag'
variable_pattern: 'standard'

# Temperature-based adjustments
# If nozzle temp >= hot_temp_threshold, use hot_temp_multiplier for wipes
variable_hot_temp_threshold: 200
variable_hot_temp_multiplier: 1.5  # Increase wipe count by this factor when hot

# Speed ramping (accelerate/decelerate during wipes)
variable_speed_ramp_enabled: True
variable_speed_ramp_min_multiplier: 0.6  # Start/end at 60% of wipe_spd
variable_speed_ramp_max_multiplier: 1.4  # Peak at 140% of wipe_spd

# Material-specific presets (override defaults when MATERIAL param is used)
# Format: wipe_qty_multiplier, speed_multiplier, pattern
variable_material_pla: [1.0, 1.0, 'standard']
variable_material_petg: [1.2, 0.9, 'zigzag']
variable_material_abs: [1.3, 0.95, 'zigzag']
variable_material_tpu: [1.5, 0.7, 'diagonal']

# Post-clean retraction to prevent oozing
variable_post_clean_retract: True
variable_post_clean_retract_length: 0.5
variable_post_clean_retract_speed: 1800

# Diagonal/zigzag pattern parameters
variable_diagonal_y_offset: 3  # Y-axis movement for diagonal/zigzag patterns

# Post-clean staging position (move to safe position after cleaning)
variable_use_stage_position: True
variable_stage_x: 70  # Center of typical 350mm bed
variable_stage_y: 331

gcode:
    _STATUS_CLEANING                 ;Status led
    M117 Cleaning Nozzle...

    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Get current extruder temperature
    {% set current_temp = printer.extruder.temperature %}

    # Load base variables
    {% set base_wipe_qty = wipe_qty %}
    {% set base_wipe_spd = wipe_spd %}
    {% set active_pattern = pattern %}

    # Apply material-specific presets if MATERIAL parameter is provided
    {% if params.MATERIAL is defined %}
        {% set material = params.MATERIAL|lower %}
        {% if material == 'pla' %}
            {% set material_config = material_pla %}
        {% elif material == 'petg' %}
            {% set material_config = material_petg %}
        {% elif material == 'abs' %}
            {% set material_config = material_abs %}
        {% elif material == 'tpu' %}
            {% set material_config = material_tpu %}
        {% else %}
            {% set material_config = [1.0, 1.0, pattern] %}
        {% endif %}
        {% set base_wipe_qty = (base_wipe_qty * material_config[0])|int %}
        {% set base_wipe_spd = (base_wipe_spd * material_config[1])|int %}
        {% set active_pattern = material_config[2] %}
    {% endif %}

    # Apply temperature-based adjustments
    {% if current_temp >= hot_temp_threshold %}
        {% set adjusted_wipe_qty = (base_wipe_qty * hot_temp_multiplier)|int %}
        M117 Hot nozzle detected ({current_temp}C), using {adjusted_wipe_qty} wipes
    {% else %}
        {% set adjusted_wipe_qty = base_wipe_qty %}
    {% endif %}

    # Override pattern if specified in parameters
    {% if params.PATTERN is defined %}
        {% set active_pattern = params.PATTERN|lower %}
    {% endif %}

    G90                                            ; absolute positioning
    M83                                            ; relative extrusion

    ## Move nozzle to start position
    G1 X{start_x} Y{start_y} F6000
    G1 Z{start_z} F1500

    ## Wipe nozzle with selected pattern
    {% if active_pattern == 'diagonal' %}
        # Diagonal pattern - wipe at an angle by varying Y position
        {% for wipe_num in range(1, (adjusted_wipe_qty + 1)) %}
            {% if speed_ramp_enabled %}
                # Calculate ramped speed (slow->fast->slow)
                {% set progress = wipe_num / adjusted_wipe_qty %}
                {% if progress <= 0.5 %}
                    {% set speed_mult = speed_ramp_min_multiplier + (speed_ramp_max_multiplier - speed_ramp_min_multiplier) * (progress * 2) %}
                {% else %}
                    {% set speed_mult = speed_ramp_max_multiplier - (speed_ramp_max_multiplier - speed_ramp_min_multiplier) * ((progress - 0.5) * 2) %}
                {% endif %}
                {% set current_speed = (base_wipe_spd * speed_mult)|int %}
            {% else %}
                {% set current_speed = base_wipe_spd %}
            {% endif %}

            {% set y_pos = start_y + diagonal_y_offset %}
            G1 X{start_x + wipe_dist} Y{y_pos} F{current_speed}
            G1 X{start_x} Y{start_y} F{current_speed}
        {% endfor %}

    {% elif active_pattern == 'zigzag' %}
        # Zigzag pattern - alternate Y offsets
        {% for wipe_num in range(1, (adjusted_wipe_qty + 1)) %}
            {% if speed_ramp_enabled %}
                {% set progress = wipe_num / adjusted_wipe_qty %}
                {% if progress <= 0.5 %}
                    {% set speed_mult = speed_ramp_min_multiplier + (speed_ramp_max_multiplier - speed_ramp_min_multiplier) * (progress * 2) %}
                {% else %}
                    {% set speed_mult = speed_ramp_max_multiplier - (speed_ramp_max_multiplier - speed_ramp_min_multiplier) * ((progress - 0.5) * 2) %}
                {% endif %}
                {% set current_speed = (base_wipe_spd * speed_mult)|int %}
            {% else %}
                {% set current_speed = base_wipe_spd %}
            {% endif %}

            {% if wipe_num % 2 == 0 %}
                {% set y_pos = start_y + diagonal_y_offset %}
            {% else %}
                {% set y_pos = start_y - diagonal_y_offset %}
            {% endif %}
            G1 X{start_x + wipe_dist} Y{y_pos} F{current_speed}
            G1 X{start_x} Y{start_y} F{current_speed}
        {% endfor %}

    {% else %}
        # Standard pattern - simple back and forth
        {% for wipe_num in range(1, (adjusted_wipe_qty + 1)) %}
            {% if speed_ramp_enabled %}
                {% set progress = wipe_num / adjusted_wipe_qty %}
                {% if progress <= 0.5 %}
                    {% set speed_mult = speed_ramp_min_multiplier + (speed_ramp_max_multiplier - speed_ramp_min_multiplier) * (progress * 2) %}
                {% else %}
                    {% set speed_mult = speed_ramp_max_multiplier - (speed_ramp_max_multiplier - speed_ramp_min_multiplier) * ((progress - 0.5) * 2) %}
                {% endif %}
                {% set current_speed = (base_wipe_spd * speed_mult)|int %}
            {% else %}
                {% set current_speed = base_wipe_spd %}
            {% endif %}

            G1 X{start_x + wipe_dist} F{current_speed}
            G1 X{start_x} F{current_speed}
        {% endfor %}
    {% endif %}

    # Post-clean retraction to prevent oozing
    {% if post_clean_retract and printer.extruder.can_extrude %}
        G1 E-{post_clean_retract_length} F{post_clean_retract_speed}
    {% endif %}

    ## Raise nozzle
    G1 Z{raise_distance}

    ## Move to staging position if enabled
    {% if use_stage_position %}
        G1 X{stage_x} Y{stage_y} F6000
        M400  # Wait for moves to complete
    {% endif %}

    _STATUS_STANDBY                 ;Status led
    M117 Nozzle Cleaned!

[gcode_macro NOZZLE_PRIME]
description: prime the nozzle before printing
gcode:
 _STATUS_BUSY                 ;Status led
 {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
 {% endif %}

   M117 Prime Line ..........     ;Prints a Prime Line 
   G92 E0.0                       ;reset extruder distance position
   G1 X10 Y10 Z0.3 F3000          ;move to prime line position
   G1 X60 E10.0 F1000             ;intro line 1
   G1 X80 E30 F500               ;intro line 2
   G92 E0.0                       ;reset extruder distance position
     
   M117 Prime Line Done!


[gcode_macro NOZZLE_PRE_TOOL_CHANGE]
description: Prepares filament for removal before tool change
variable_safe_z: 50
variable_safe_x: 315    
variable_safe_y: 350
gcode:
    # Move toolhead to safe position
    _STATUS_BUSY                 ;Status led
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}

    SAVE_GCODE_STATE NAME=NOZZLE_PRE_TOOL_CHANGE_STATE

    G91 ; relative positioning
    G0 F9000 Z5 ; lift Z relative to current position
    G90 ; absolute positioning

    CUT_TIP
    M400
    # NOZZLE_CLEAN
    # M400

    G0 X{safe_x} Y{safe_y} F9000 ; move to safe XY position
    # wait for move to complete
    M400
    G0 Z{safe_z} F600 ; move to safe Z height
    M400

    M117 Nozzle ready for tool change
  
[gcode_macro NOZZLE_POST_TOOL_CHANGE]
description: Call this after tool change to purge nozzle
gcode:
    NOZZLE_PURGE # this will also clean the nozzle
    # Wait for purge to complete
    M400
    RESTORE_GCODE_STATE NAME=NOZZLE_PRE_TOOL_CHANGE_STATE MOVE_SPEED=2000 MOVE=1


[gcode_macro CHANGE_TOOL]
gcode:
    # Get tool number
    {% set TOOL = params.TOOL | int %}
    NOZZLE_PRE_TOOL_CHANGE
    ACE_CHANGE_TOOL TOOL={TOOL}
    # if tool is not -1, do post tool change
    {% if TOOL != -1 %}
        NOZZLE_POST_TOOL_CHANGE
    {% endif %}



[gcode_macro T0]
gcode:
    CHANGE_TOOL TOOL=0

[gcode_macro T1]
gcode:
    CHANGE_TOOL TOOL=1

[gcode_macro T2]
gcode:
    CHANGE_TOOL TOOL=2

[gcode_macro T3]
gcode:
    CHANGE_TOOL TOOL=3

[gcode_macro T4]
gcode:
    CHANGE_TOOL TOOL=4

[gcode_macro T5]
gcode:
    CHANGE_TOOL TOOL=5

[gcode_macro T6]
gcode:
    CHANGE_TOOL TOOL=6

[gcode_macro T7]
gcode:
    CHANGE_TOOL TOOL=7

[gcode_macro T8]
gcode:
    CHANGE_TOOL TOOL=8