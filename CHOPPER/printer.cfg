[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_330043001750535556323420-if00

[mcu nozzle_mcu]
serial : /dev/ttyS0
restart_method : command
baud : 576000
# fw_max_size: 40960
# fw_sector_size: 2048
# fw_ota_sector_offset: 20



[printer]
kinematics: corexz
max_velocity: 300
max_accel: 1500
max_z_velocity: 50
max_z_accel: 300
square_corner_velocity: 10.0

[extruder]
max_extrude_only_distance : 100.0
step_pin : nozzle_mcu:PC14
dir_pin : nozzle_mcu:PC15
enable_pin : !nozzle_mcu:PC13
microsteps : 16
full_steps_per_rotation:200
rotation_distance :6.426
nozzle_diameter : 0.400
filament_diameter : 1.750
max_extrude_cross_section:50
heater_pin : nozzle_mcu:PB8
sensor_type : NTC 100K MGB18-104F39050L32
sensor_pin : nozzle_mcu:PA0
control : pid
pid_Kp : 12.206120
pid_Ki : 0.517208
pid_Kd : 72.016108
min_temp : -200
# min_safe_temp : 170
min_extrude_temp : 170
# max_safe_temp : 300
max_temp : 320
pressure_advance: 0.02

[tmc2209 extruder]
uart_pin : nozzle_mcu:PA3
uart_address : 3
run_current : 0.8
hold_current:0.4
sense_resistor: 0.0750
stealthchop_threshold : 99999
interpolate : True

# [led_pin]
# pin1 : nozzle_mcu:PB9
# pin2 : !nozzle_mcu:PA15
# value: 0


# [lis2dw12]
# spi_speed: 1000000
# cs_pin: nozzle_mcu:PB12
# spi_software_sclk_pin:nozzle_mcu:PB13
# spi_software_mosi_pin:nozzle_mcu:PB15
# spi_software_miso_pin:nozzle_mcu:PB14
# rate:400
# axes_map:x,y,z


[temperature_sensor Host]
sensor_type: temperature_host

# [temperature_sensor MCU]
# sensor_type: temperature_mcu

[idle_timeout]
timeout: 1800

[safe_z_home]
home_xy_position:200,200
speed:100
z_hop:10


[respond]
default_type: echo

#####################################################################
#   LED Control
#####################################################################


[display_status]


# ########################################
# # EXP1 / EXP2 (display) pins
# ########################################

# [board_pins]
# aliases:
#     # EXP1 header
#     EXP1_1=PE8, EXP1_2=PE7,
#     EXP1_3=PE9, EXP1_4=PE10,
#     EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
#     EXP1_7=PE14, EXP1_8=PE15,
#     EXP1_9=<GND>, EXP1_10=<5V>,

#     # EXP2 header
#     EXP2_1=PA6, EXP2_2=PA5,
#     EXP2_3=PB1, EXP2_4=PA4,
#     EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
#     EXP2_7=PC15, EXP2_8=<RST>,
#     EXP2_9=<GND>, EXP2_10=<5V>
    
# [output_pin beeper]
# pin: EXP1_1
# value: 0
# shutdown_value: 0
# pwm: True
# cycle_time: 0.0005 ; Default beeper tone in kHz. 1 / 0.0005 = 2000Hz (2kHz)   

# Enable object exclusion
[exclude_object]

# Enable arcs support
[gcode_arcs]
resolution: 0.1

#####################################################################
#  Macros and Custom G-Codes
#####################################################################


